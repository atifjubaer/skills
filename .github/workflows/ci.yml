name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  skills:
    name: Skill folders and registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate skill frontmatter and skills.sh registry
        run: node scripts/validate-skills.mjs

      - name: Check the published package contents
        run: node scripts/check-package.mjs

  servers:
    name: Build and probe ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [fluentcart-developer, lemonsqueezy-developer]
    defaults:
      run:
        working-directory: servers/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servers/${{ matrix.package }}/package-lock.json

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Protocol, tool and skills catalog probe
        run: npm run verify

  docker:
    name: Docker image and healthcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image from repo root
        run: docker build -f servers/fluentcart-developer/Dockerfile -t fluentcart-developer .

      - name: Boot container and hit /health
        run: |
          docker run -d --name fluentcart -p 8080:8080 \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 fluentcart-developer
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          echo "healthcheck never came up"
          docker logs suite
          exit 1

      - name: Container logs
        if: always()
        run: docker logs suite || true
  sdk-compile:
    name: Generated clients compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servers/fluentcart-developer/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build the server
        working-directory: server
        run: |
          npm ci
          npm run build

      # Presence checks cannot see a doubled declaration. This job compiles
      # what the generators actually emit.
      - name: Generate every client
        run: node scripts/gen-samples.mjs

      - name: Typecheck TypeScript
        working-directory: server
        run: npx tsc --noEmit --strict --target es2020 --module commonjs --moduleResolution node --skipLibCheck --types node samples-out/license.ts

      - name: Compile .NET
        run: |
          mkdir -p /tmp/dotnet && cd /tmp/dotnet
          dotnet new classlib -f net8.0 --force >/dev/null
          rm -f Class1.cs
          cp "$GITHUB_WORKSPACE/servers/fluentcart-developer/samples-out/LicenseClient.cs" .
          dotnet build -c Release --nologo

      - name: Compile Java
        run: javac -Xlint:all -d /tmp/jout servers/fluentcart-developer/samples-out/FastrLicense.java

      - name: Lint PHP
        run: php -l servers/fluentcart-developer/samples-out/FastrLicense.php

      - name: Compile Go
        run: |
          mkdir -p /tmp/gocheck && cd /tmp/gocheck
          cp "$GITHUB_WORKSPACE/servers/fluentcart-developer/samples-out/LicenseClient.go" .
          go mod init sample >/dev/null 2>&1 || true
          go vet ./...
          go build ./...

      - name: Compile C
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev libssl-dev
          gcc -fsyntax-only -Wall -Wextra servers/fluentcart-developer/samples-out/fastr_license.c

  sdk-compile-extra:
    name: Generated clients compile (Kotlin, Swift)
    runs-on: ${{ matrix.os }}
    # Both compile green since 1d46832. Blocking from now on.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lang: kotlin
          - os: macos-latest
            lang: swift
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servers/fluentcart-developer/package-lock.json

      - uses: actions/setup-java@v4
        if: matrix.lang == 'kotlin'
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the server
        working-directory: server
        run: |
          npm ci
          npm run build

      - name: Generate every client
        run: node scripts/gen-samples.mjs

      - name: Compile Kotlin
        if: matrix.lang == 'kotlin'
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlin.zip -d /tmp
          curl -fsSL -o /tmp/json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          /tmp/kotlinc/bin/kotlinc -classpath /tmp/json.jar -d /tmp/kout.jar servers/fluentcart-developer/samples-out/LicenseClient.kt

      - name: Compile Swift
        if: matrix.lang == 'swift'
        run: swiftc -typecheck servers/fluentcart-developer/samples-out/LicenseClient.swift
