# MCPize deployment manifest.
#
# The deploy root is the repository root, but the MCP server package lives in
# server/ — every build and start command is prefixed accordingly. `entry` points
# MCPize's capability scan at the file that imports the MCP SDK; without it the
# scan reports "no MCP capabilities" because the root package.json is the skills
# CLI, not the server.
#
# `runtime: container` rejects this image ("HTTP base Dockerfile not supported
# for runtime: container"), so the manifest uses the TypeScript runtime and lets
# MCPize build and run the server directly. server/Dockerfile stays for local
# runs and for hosts that take a Docker image.
#
# Deploy: `npx mcpize deploy` from this directory. Secrets below are entered in
# the MCPize dashboard, never committed.
version: 1
name: fastr-mcp-suite
description: FluentCart Pro Agent and Lemon Squeezy Developer Agent — hooks, DB schemas, API docs, webhook and licence verification for AI coding clients.
runtime: typescript

# The MCP HTTP entry point. server/build also bundles skills/ into server/dist/skills.
entry: server/src/http.ts

build:
  # The generated Dockerfile copies only the *root* package manifests before
  # running `install` (COPY package*.json ./), so server/package-lock.json does not
  # exist at that point and `npm --prefix server ci` dies with EUSAGE. Dependencies
  # are installed by the build command instead, which runs after the full source
  # copy. `install` is deliberately a no-op.
  #
  # The build command is a Node script rather than a shell one-liner: `mcpize
  # deploy` runs it through cmd.exe on Windows and /bin/sh in the image, so it has
  # to be portable. See scripts/build-for-mcpize.mjs.
  install: echo "dependencies are installed by the build command"
  command: node scripts/build-for-mcpize.mjs

# The runtime image only carries /app/dist and /app/node_modules, so the build
# command moves the server's output up to the image root.
startCommand:
  type: http
  command: node dist/http.js

# Publisher secrets: infrastructure config only. All optional, so a deploy
# succeeds on an empty dashboard and the server falls back to core behaviour.
secrets:
  - name: ALLOWED_HOSTS
    required: false
    description: Comma-separated Host allowlist for DNS-rebinding protection. Set it to the assigned *.mcpize.run domain.
    placeholder: your-server.mcpize.run
  - name: LS_STORE_ID
    required: false
    description: Lemon Squeezy store id. When set, licence keys from any other store are rejected.
  - name: LS_PRODUCT_ALL_ACCESS
    required: false
    description: Lemon Squeezy product id for All-Access. Licences for it unlock every card.
  - name: LS_PRODUCT_FLUENTCART
    required: false
    description: Lemon Squeezy product id for Card 1 (FluentCart Pro Agent).
  - name: LS_PRODUCT_LEMONSQUEEZY
    required: false
    description: Lemon Squeezy product id for Card 2 (Lemon Squeezy Developer Agent).
  - name: VALID_LICENSE_KEYS
    required: false
    description: Comma-separated ops tokens that are always All-Access (internal seats, CI).
  - name: MCPIZE_GATEWAY_SECRET
    required: false
    description: Fixed token the MCPize gateway can present to mark a request as marketplace-billed. Compared in constant time.
  - name: AGENSI_GATEWAY_SECRET
    required: false
    description: Same mechanism for the Agensi gateway.

# Subscriber credentials: the buyer's own Lemon Squeezy licence key, forwarded in
# its own header alongside MCPize's credential. Optional — without it the session
# runs the free core tools.
credentials_mode: per_user
credentials:
  - name: LICENSE_KEY
    required: false
    description: Your Lemon Squeezy licence key. Unlocks the Pro tools for the cards you own; leave empty to use the free tools.
    placeholder: 00000000-0000-0000-0000-000000000000
    mapping:
      # Must not be Authorization: MCPize validates that header as its own
      # credential at the edge and rejects anything else with 401 before the
      # request reaches the container (measured 2026-10-29). The licence key
      # rides in its own header, next to the MCPize credential, which is what
      # authenticateRequest reads first.
      header: X-MCP-License-Key
