<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lemon.js Checkout Overlay Demo</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 40px; line-height: 1.6; max-width: 600px; margin: auto; }
    .card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .btn { display: inline-block; background: #7047eb; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; cursor: pointer; border: none; }
    .btn:hover { background: #5b34d9; }
    #status { margin-top: 20px; padding: 12px; border-radius: 6px; background: #f8fafc; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Pro Developer Toolkit</h2>
    <p>Get instant access to developer tools, APIs, and lifetime updates.</p>
    <h3>$49.00 <span style="font-size: 0.9rem; color: #64748b;">one-time</span></h3>

    <!-- 1. Anchor link with lemonsqueezy-button class and custom query parameters -->
    <a href="https://your-store.lemonsqueezy.com/buy/variant_12345?checkout[custom][user_id]=user_abc123&checkout[email]=buyer@example.com"
       class="lemonsqueezy-button btn">
      Buy Now (Popup Overlay)
    </a>

    <div id="status">Waiting for user interaction...</div>
  </div>

  <!-- 2. Include official Lemon.js CDN script -->
  <script src="https://assets.lemonsqueezy.com/lemon.js" defer></script>

  <!-- 3. Handle checkout lifecycle events -->
  <script>
    window.createLemonSqueezy = function () {
      if (window.LemonSqueezy) {
        window.LemonSqueezy.Setup({
          eventHandler: (event) => {
            const statusEl = document.getElementById('status');
            console.log('Lemon.js Event:', event.event, event.data);

            if (event.event === 'Checkout.Success') {
              statusEl.style.background = '#dcfce7';
              statusEl.style.color = '#166534';
              statusEl.innerText = 'Payment successful! Order ID: ' + (event.data?.order?.id || 'Confirmed');
              // Redirect or refresh state
            } else if (event.event === 'Payment.Failed') {
              statusEl.style.background = '#fee2e2';
              statusEl.style.color = '#991b1b';
              statusEl.innerText = 'Payment failed. Please check your card.';
            }
          }
        });
      }
    };
  </script>
</body>
</html>
